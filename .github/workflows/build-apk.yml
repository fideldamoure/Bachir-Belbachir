name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web assets (local libs + Tailwind)
        run: npm run build

      - name: Verify web assets
        run: |
          echo "--- www ---"; ls -la www
          echo "--- www/vendor ---"; ls -la www/vendor
          echo "--- sizes ---"
          wc -c src/index.html src/input.css tailwind.config.js scripts/prepare-www.js www/vendor/tailwind.css
          [ "$(wc -c < www/vendor/tailwind.css)" -gt 8000 ] || { echo "::error::tailwind.css فارغ أو صغير جداً: تحقق من src/input.css و tailwind.config.js"; exit 1; }
          grep -q 'vendor/tailwind.css' www/index.html || { echo "::error::src/index.html ليس النسخة المحلية (ما زال يستخدم CDN)"; exit 1; }
          [ -f www/vendor/fontawesome/css/all.min.css ] || { echo "::error::ملف FontAwesome مفقود"; exit 1; }
          [ -d www/vendor/fontawesome/webfonts ] || { echo "::error::خطوط FontAwesome مفقودة"; exit 1; }
          [ -f www/vendor/fonts.css ] || { echo "::error::fonts.css مفقود"; exit 1; }

      - name: Add and sync Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tlemcen-audit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
